<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root { --hud-opacity: 0.70; --hud-vis: 1; --glow: 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent !important; overflow: hidden; user-select: none; }
  body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  body.edit-mode {
    -webkit-app-region: drag;
    outline: 2px dashed rgba(255,204,0,0.5); outline-offset: -2px;
  }

  /* Static backdrop layer: canvas-painted rounded-rect plate with curvature-
     eased corners and a narrow exponential alpha ramp fully contained in the
     window (no border clipping, no muddy blur). Painted once, repainted only
     on resize / radius change. z-index:-1 pins it below #hud even when
     hud_opacity=1.0. Sibling of #hud — never a parent — so per-frame content
     updates never re-rasterize it. */
  #backdrop {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; opacity: 0; z-index: -1;
    transition: opacity 0.5s;
  }

  /* #hud opacity = visibility only (show/hide fade). User opacity
     (--hud-opacity) applies to TEXT elements only — the rpm bar, marker
     lines, power band and glows stay at full brightness (legacy HUD
     behavior: hud_opacity never dimmed the indicators). */
  #hud {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; opacity: var(--hud-vis); transition: opacity 0.5s;
  }
  /* zoom scales layout WITHOUT creating a stacking context (unlike transform),
     so glow elements can additively blend (plus-lighter) with the backdrop
     plate below them — light adds to the mask instead of being dulled by it.
     G-float uses left/top (position:relative, also no stacking context). */
  #hud-inner { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  #top-row { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin-bottom: 6px; }
  #gear { position: relative; line-height: 1; text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 24px rgba(0,0,0,0.9); color: #fff; }
  #gear-txt { opacity: var(--hud-opacity); }
  #gear.italic { font-style: italic; }
  #gear.glow { padding: 1px 5px; }
  #gear.glow::before {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(to top, rgba(255,255,255,0.16), transparent);
    mix-blend-mode: plus-lighter;
  }
  #speed-wrap { display: flex; align-items: center; gap: 3px; }
  #speed { font-family: 'Consolas', 'Cascadia Code', monospace; color: #fff; opacity: var(--hud-opacity); text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.4); }
  #speed.italic { font-style: italic; }
  #labels { display: flex; flex-direction: column; color: #fff; opacity: calc(var(--hud-opacity) * 0.85); line-height: 1.15; text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.4); }
  #labels.italic { font-style: italic; }

  /* Marker glow stack (three layers, per line):
     1. line core: solid color, source-over — hue anchor, LED-on-white visible.
     2. ::before: dark backing halo (source-over) — invisible on dark scenes;
        on bright scenes digs a local contrast pad so the glow can pop.
     3. ::after: additive glow (plus-lighter) — tight hue-tinted hot core +
        wide colored aura. Channels clamp toward white naturally; pure white
     was too blinding at night, so the hot core is tinted and moderate. */
  #rpm-wrap { position: relative; width: 260px; height: 5px; background: rgba(255,255,255,0.10); margin-bottom: 6px; }
  #rpm-bar { height: 100%; position: relative; }
  #rpm-bar::after {
    content:""; position:absolute; right:0; top:0; width:1px; height:100%; background:#fff;
    mix-blend-mode: plus-lighter;
    box-shadow: 0 0 calc(4px*var(--glow)) calc(1px*var(--glow)) rgba(255,255,255,calc(0.6*var(--glow))),
                0 0 calc(10px*var(--glow)) calc(2px*var(--glow)) rgba(255,255,255,calc(0.35*var(--glow)));
  }
  #shift-line, #limiter-line { position: absolute; top: -2px; width: 2px; height: 9px; }
  #shift-line { background: #3399ff; }
  #limiter-line { background: #ff3333; }
  #shift-line::before, #limiter-line::before {
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow: 0 0 calc(9px*var(--glow)) calc(3px*var(--glow)) rgba(0,0,0,calc(0.5*var(--glow)));
  }
  #shift-line::after, #limiter-line::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    mix-blend-mode: plus-lighter;
  }
  #shift-line::after {
    box-shadow: 0 0 calc(4px*var(--glow)) calc(1px*var(--glow)) rgba(200,230,255,calc(0.5*var(--glow))),
                0 0 calc(12px*var(--glow)) calc(3px*var(--glow)) rgba(51,153,255,calc(0.65*var(--glow)));
  }
  #limiter-line::after {
    box-shadow: 0 0 calc(4px*var(--glow)) calc(1px*var(--glow)) rgba(255,210,200,calc(0.5*var(--glow))),
                0 0 calc(12px*var(--glow)) calc(3px*var(--glow)) rgba(255,51,51,calc(0.65*var(--glow)));
  }
  #pwr-band { position: absolute; top: 2px; height: 1px; background: #fff; opacity: 0.6; mix-blend-mode: plus-lighter; }

  /* Slip bar: max |slip ratio| across all four wheels, always on while moving.
     Flat and dim by design (background instrument, not an alarm). Thresholds
     are speed-scaled: lenient at crawl (the launch dig is not actionable),
     full discipline from ~25 km/h. Zones: white <0.5, yellow, red >2.0. */
  #slip-wrap { position: relative; width: 260px; height: 3px; background: rgba(255,255,255,0.06); margin: -2px 0 6px; }
  #slip-bar { height: 100%; width: 0%; }

  #info-row { display: flex; gap: 12px; color: #fff; opacity: calc(var(--hud-opacity) * 0.85); font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.4); }

  .strobe { animation: flash 0.08s steps(2) infinite alternate; }
  .bar-strobe { animation: bar-flash 0.08s steps(2) infinite alternate !important; }
  .strobe-red { animation: flash-red 0.08s steps(2) infinite alternate; }
  .bar-strobe-red { animation: bar-flash-red 0.08s steps(2) infinite alternate !important; }
  @keyframes flash {
    0%   { color: #3399ff; text-shadow: 0 0 calc(30px*var(--glow)) #3399ff; }
    100% { color: #fff; text-shadow: 0 0 calc(60px*var(--glow)) #88ccff; }
  }
  @keyframes bar-flash {
    0% { background: linear-gradient(to right,#3399ff44,#3399ff); box-shadow: 0 0 calc(12px*var(--glow)) calc(3px*var(--glow)) rgba(51,153,255,calc(0.7*var(--glow))); }
    100% { background: linear-gradient(to right,#ffffff88,#fff); box-shadow: 0 0 calc(16px*var(--glow)) calc(5px*var(--glow)) rgba(200,220,255,calc(0.8*var(--glow))); }
  }
  @keyframes flash-red {
    0%   { color: #ff3333; text-shadow: 0 0 calc(30px*var(--glow)) #ff3333; }
    100% { color: #fff; text-shadow: 0 0 calc(60px*var(--glow)) #ff9999; }
  }
  @keyframes bar-flash-red {
    0% { background: linear-gradient(to right,#ff330044,#ff3300); box-shadow: 0 0 calc(12px*var(--glow)) calc(3px*var(--glow)) rgba(255,51,0,calc(0.7*var(--glow))); }
    100% { background: linear-gradient(to right,#ffffff88,#fff); box-shadow: 0 0 calc(16px*var(--glow)) calc(5px*var(--glow)) rgba(255,200,180,calc(0.8*var(--glow))); }
  }
</style>
</head>
<body>
<canvas id="backdrop"></canvas>
<div id="hud">
  <div id="hud-inner">
    <div id="top-row">
      <div id="gear"><span id="gear-txt">N</span></div>
      <div id="speed-wrap">
        <div id="speed">000</div>
        <div id="labels"><span>KM/H</span><span id="slip">SLIP</span></div>
      </div>
    </div>
    <div id="rpm-wrap">
      <div id="rpm-bar"></div>
      <div id="pwr-band"></div>
      <div id="shift-line"></div>
      <div id="limiter-line"></div>
    </div>
    <div id="slip-wrap"><div id="slip-bar"></div></div>
    <div id="info-row">
      <span id="rpm-text">0 rpm</span>
      <span id="hp-text">0 hp</span>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function gearLabel(g){return g===0?"R":g===-1?"N":String(g);}

// Backdrop plate: rounded rectangle with "continuous corners" — each corner is
// a clothoid (curvature ramps 0 → 1/ra linearly) + circular arc + clothoid, so
// straight edges stay straight and the line-to-arc joints are curvature-
// continuous (no kink, no mid-corner pinch). Smoothness = hud_backdrop_smooth
// (_bkS): the clothoid share of the 90° turn, 0 = pure circular arc, 1 = fully
// eased. Corner footprint D = hud_backdrop_radius (_bkR). Alpha falls off as
// maxA·exp(-d/τ) (τ=tail/3) with per-layer compositing correction; fade rings
// are EXACT parallel offsets of the base plate (every corner sample carries
// its analytic normal), fully contained in the window. Painted once on load,
// on resize, and on radius/smoothness change only.
function paintBackdrop(){
  const c=$("backdrop"),dpr=window.devicePixelRatio||1;
  const w=window.innerWidth,h=window.innerHeight;
  c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);
  const ctx=c.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const tail=12,maxA=0.45,tau=tail/3,N=10;
  const D=Math.max(0,Math.min(window._bkR??100,w/2-tail,h/2-tail));
  const sm=Math.max(0,Math.min(1,window._bkS??0.5));
  // Fresnel auxiliaries: C(λ)=∫₀^λ cos(φu²)du, S(λ)=∫₀^λ sin(φu²)du (series)
  function fcs(phi,lam){
    let C=0,S=0,sign=1,cn=lam,cf=1,sn=phi*lam*lam*lam,sf=1;
    for(let n=0;n<40;n++){
      const ct=sign*cn/(cf*(4*n+1)),st=sign*sn/(sf*(4*n+3));
      C+=ct;S+=st;
      if(Math.abs(ct)+Math.abs(st)<1e-13)break;
      sign=-sign;
      const p2l4=phi*phi*lam*lam*lam*lam;
      cn*=p2l4;cf*=(2*n+1)*(2*n+2);
      sn*=p2l4;sf*=(2*n+2)*(2*n+3);
    }
    return[C,S];
  }
  // TR corner samples in local frame: A=(0,0) joint on top edge, geometric
  // corner=(D,0), B=(D,D) joint on right edge. Each sample carries its
  // outward unit normal (sin h, -cos h) from the tangent heading h.
  function cornerPts(){
    const pts=[{x:0,y:0,sn:0,cs:1}];
    if(D<0.5)return pts;
    const phi=sm*Math.PI/4;
    if(phi<1e-6){ // pure circular arc, radius D
      for(let i=1;i<=24;i++){const hd=i/24*Math.PI/2;
        pts.push({x:D*Math.sin(hd),y:D*(1-Math.cos(hd)),sn:Math.sin(hd),cs:Math.cos(hd)});}
      return pts;
    }
    const[C1,S1]=fcs(phi,1);
    const ra=D/(2*phi*(C1+S1)+Math.cos(phi)-Math.sin(phi));
    const L=2*phi*ra,cloth=[];
    for(let i=1;i<=14;i++){
      const lam=i/14,[cc,ss]=fcs(phi,lam),hd=phi*lam*lam;
      cloth.push({x:L*cc,y:L*ss,sn:Math.sin(hd),cs:Math.cos(hd)});
    }
    const ce=cloth[cloth.length-1];
    const cx=ce.x-ra*Math.sin(phi),cy=ce.y+ra*Math.cos(phi);
    for(const p of cloth)pts.push(p);
    const hEnd=Math.PI/2-phi;
    if(hEnd-phi>1e-9){
      for(let i=1;i<=16;i++){
        const hd=phi+(hEnd-phi)*i/16;
        pts.push({x:cx+ra*Math.sin(hd),y:cy-ra*Math.cos(hd),sn:Math.sin(hd),cs:Math.cos(hd)});
      }
    }
    for(let i=cloth.length-2;i>=0;i--){ // mirror across the 45° diagonal (skip dup of arc end)
      const p=cloth[i];
      pts.push({x:D-p.y,y:D-p.x,sn:p.cs,cs:p.sn});
    }
    pts.push({x:D,y:D,sn:1,cs:0}); // B = mirror of A, exact joint on right edge
    return pts;
  }
  const corner=cornerPts();
  // Base plate geometric corners (fixed at inset tail; ring d = offset s=tail-d)
  const g=[[w-tail,tail],[w-tail,h-tail],[tail,h-tail],[tail,tail]];
  function plate(d){
    const x0=d,y0=d,x1=w-d,y1=h-d;
    ctx.beginPath();
    if(D<0.5){ctx.rect(x0,y0,x1-x0,y1-y0);return;}
    const s=tail-d; // ring = base plate offset outward by s along normals
    const P=corner.map(p=>({x:p.x+s*p.sn,y:p.y-s*p.cs}));
    const TR=P.map(p=>[g[0][0]-D+p.x,g[0][1]+p.y]);
    const BR=P.map(p=>[g[1][0]-p.y,g[1][1]-D+p.x]);
    const BL=P.map(p=>[g[2][0]+D-p.x,g[2][1]-p.y]);
    const TL=P.map(p=>[g[3][0]+p.y,g[3][1]+D-p.x]);
    ctx.moveTo(TL[TL.length-1][0],TL[TL.length-1][1]); // top edge, left joint
    ctx.lineTo(TR[0][0],TR[0][1]);
    for(const q of TR)ctx.lineTo(q[0],q[1]);
    ctx.lineTo(BR[0][0],BR[0][1]);
    for(const q of BR)ctx.lineTo(q[0],q[1]);
    ctx.lineTo(BL[0][0],BL[0][1]);
    for(const q of BL)ctx.lineTo(q[0],q[1]);
    ctx.lineTo(TL[0][0],TL[0][1]);
    for(const q of TL)ctx.lineTo(q[0],q[1]);
    ctx.closePath();
  }
  let prev=0;
  for(let i=0;i<N;i++){
    const d=tail*i/(N-1);
    const target=maxA*Math.exp(-(tail-d)/tau);
    const a=(target-prev)/(1-prev);prev=target;
    if(a<=0.001)continue;
    plate(d);
    ctx.fillStyle=`rgba(0,0,0,${a.toFixed(4)})`;
    ctx.fill();
  }
  // Glass rim: faint top-down light wash + specular edge highlight
  ctx.save();
  plate(tail);ctx.clip();
  const wash=ctx.createLinearGradient(0,tail,0,h-tail);
  wash.addColorStop(0,"rgba(255,255,255,0.055)");
  wash.addColorStop(0.35,"rgba(255,255,255,0.015)");
  wash.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=wash;ctx.fillRect(0,0,w,h);
  const rim=ctx.createLinearGradient(0,tail,0,tail+Math.min(90,h*0.45));
  rim.addColorStop(0,"rgba(255,255,255,0.16)");
  rim.addColorStop(1,"rgba(255,255,255,0)");
  ctx.strokeStyle=rim;ctx.lineWidth=1.4;
  plate(tail);ctx.stroke();
  ctx.restore();
}
window.addEventListener("resize",paintBackdrop);
paintBackdrop();
// RPM bar brightness/hue: transform gradient stops in HSL space rather than a
// CSS filter — filter would create a stacking context and isolate the bar cap
// glow's additive (plus-lighter) blending with the backdrop. Stops come from a
// tiny fixed palette, so results are memoized; defaults (1, 0) pass through.
const _tintCache={};
function tint(col,bri,hue){
  if(bri===1&&!hue)return col;
  const key=col+"|"+bri+"|"+hue,cached=_tintCache[key];
  if(cached)return cached;
  let r=0,g=0,b=0,a=1,ok=true;
  if(col[0]==="#"){
    const h=col.slice(1);
    if(h.length>=6){r=parseInt(h.substr(0,2),16);g=parseInt(h.substr(2,2),16);b=parseInt(h.substr(4,2),16);if(h.length===8)a=parseInt(h.substr(6,2),16)/255;}
    else ok=false;
  }else{
    const m=col.match(/[\d.]+/g);
    if(m&&m.length>=3){r=+m[0];g=+m[1];b=+m[2];if(m.length>3)a=+m[3];}else ok=false;
  }
  if(!ok)return col;
  r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  let h=0,sg=0,l=(mx+mn)/2;
  if(mx!==mn){
    const dd=mx-mn;
    sg=l>0.5?dd/(2-mx-mn):dd/(mx+mn);
    if(mx===r)h=(g-b)/dd+(g<b?6:0);else if(mx===g)h=(b-r)/dd+2;else h=(r-g)/dd+4;
    h*=60;
  }
  h=(h+hue)%360;if(h<0)h+=360;
  l=Math.max(0,Math.min(1,l*bri));
  const c=(1-Math.abs(2*l-1))*sg,x=c*(1-Math.abs((h/60)%2-1)),mm=l-c/2;
  let rr=0,gg=0,bb=0;
  if(h<60){rr=c;gg=x;}else if(h<120){rr=x;gg=c;}else if(h<180){gg=c;bb=x;}
  else if(h<240){gg=x;bb=c;}else if(h<300){rr=x;bb=c;}else{rr=c;bb=x;}
  const R=Math.round((rr+mm)*255),G=Math.round((gg+mm)*255),B=Math.round((bb+mm)*255);
  const out=a<1?`rgba(${R},${G},${B},${a})`:`#${((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1)}`;
  _tintCache[key]=out;
  return out;
}

function rpmColor(pct,ys,bluePct){
  // Returns [from, to] gradient stops. NOTE: every stop must be a complete
  // color value — the old single-color + `${c}44` suffix pattern produced
  // invalid CSS ("rgba(...)44") in the dim state and killed the bar entirely.
  // Zones anchor to the shift (blue) line: white→yellow→orange→red completes
  // exactly at the blue line, so the full progression displays before the
  // blue strobe takes over. Past the line: static red under the strobes.
  const y0=ys*100,top=(bluePct>y0+1)?bluePct:100;
  if(pct<y0)return["rgba(255,255,255,0.12)","rgba(255,255,255,0.45)"];
  const z=(top-y0)/3;
  if(pct<y0+z)return["#ffdd0044","#ffdd00"];
  if(pct<y0+2*z)return["#ff880044","#ff8800"];
  return["#ff330044","#ff3300"];
}

function connect(){
  const ws=new WebSocket("ws://127.0.0.1:9000");
  ws.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.type!=="telemetry")return;

    const s=d.settings||{};
    // Opacity: container = show/hide only; user opacity dims text elements
    // (see CSS note). Bars/lines/glows always render at full brightness.
    const editOn=document.body.classList.contains("edit-mode");
    document.documentElement.style.setProperty("--hud-vis",(d.hud_visible||editOn)?"1":"0");
    document.documentElement.style.setProperty("--hud-opacity",s.hud_opacity??0.70);
    $("backdrop").style.opacity=(d.hud_visible||editOn)?(s.hud_backdrop??0.30):"0";
    if(s.hud_backdrop_radius!==window._bkR||s.hud_backdrop_smooth!==window._bkS){window._bkR=s.hud_backdrop_radius;window._bkS=s.hud_backdrop_smooth;paintBackdrop();}
    // Glow auto-adapts to ambient scene brightness (env_luma sampled by the
    // backend around the HUD window): additive glows can't outshine a bright
    // background, so they retract in daylight and open up in the dark.
    const el=d.env_luma??-1;
    if(window._envF===undefined)window._envF=0.75;
    const envTarget=el<0?0.75:el<0.28?0.75:el>0.62?0.12:0.75+(0.12-0.75)*(el-0.28)/0.34;
    window._envF+=(envTarget-window._envF)*0.3;
    document.documentElement.style.setProperty("--glow",(s.hud_glow??1)*window._envF);
    $("pwr-band").style.opacity=s.power_band_opacity??0.5;
    // Scale
    const scale=s.hud_scale||2.0;
    // G-force float with EMA smoothing + per-axis sensitivity
    const gAmp=s.g_float_amplitude||0;
    let gx=0,gy=0;
    if(gAmp>0){
      const rawLat=(d.accel_lat||0), rawLon=(d.accel_lon||0);
      const lat=Math.abs(rawLat)>0.15?rawLat:0;
      const lon=Math.abs(rawLon)>0.2?rawLon:0;
      const accelG=lon>0?lon:0, brakeG=lon<0?-lon:0;
      const lonScale=lon>0?(s.g_float_accel_scale||0.5):(s.g_float_brake_scale||1.0);
      const targetX=lat*(s.g_float_lat_scale||1.0)*gAmp;
      const targetY=-lon*lonScale*gAmp;
      const alpha=s.g_float_smoothing||0.08;
      // Use window-level persistent smoothed values
      if(!window._gSmooth){window._gSmooth={x:0,y:0};}
      window._gSmooth.x+=((targetX||0)-window._gSmooth.x)*alpha;
      window._gSmooth.y+=((targetY||0)-window._gSmooth.y)*alpha;
      gx=window._gSmooth.x;gy=window._gSmooth.y;
    }
    // zoom replicates scale() without creating a stacking context; left/top
    // offsets are in unscaled parent space, so multiply by scale to match the
    // old scale(s)·translate(g) net offset.
    const inner=$("hud-inner");
    inner.style.zoom=scale;
    inner.style.left=(gx*scale).toFixed(1)+"px";
    inner.style.top=(gy*scale).toFixed(1)+"px";
    // Font settings
    $("gear").style.fontSize=(s.gear_font_size||28)+"px";
    $("gear").style.fontWeight=s.gear_font_weight||500;
    $("gear").classList.toggle("italic",!!s.gear_italic);
    $("gear").classList.toggle("glow",!!s.gear_glow);

    $("speed").style.fontSize=(s.speed_font_size||42)+"px";
    $("speed").style.fontWeight=s.speed_font_weight||500;
    $("speed").classList.toggle("italic",!!s.speed_italic);

    $("labels").style.fontSize=(s.label_font_size||12)+"px";
    $("labels").classList.toggle("italic",!!s.label_italic);
    $("top-row").style.gap=(s.top_row_gap||4)+"px";
    $("speed-wrap").style.gap=(s.speed_label_gap||3)+"px";

    // Data
    const rpm=d.rpm||0,rpmMax=d.rpm_max||8000,rpmIdle=d.rpm_idle||1500;
    const range=rpmMax-rpmIdle||1;
    const rpmPct=Math.max(0,Math.min(100,(rpm-rpmIdle)/range*100));
    const ys=s.gear_yellow_start||0.5;
    const sa=d.shift_advice||{};

    $("gear-txt").textContent=gearLabel(d.gear);
    $("speed").textContent=String(Math.round(d.speed_kmh||0)).padStart(3,"0");
    // RPM bar width
    $("rpm-wrap").style.width=(s.rpm_bar_width||260)+"px";
    $("rpm-text").textContent=Math.round(rpm)+" rpm";
    $("hp-text").textContent=Math.round((d.power_kw||0)*1.341)+" hp";

    // RPM bar — color zones anchor to the shift (blue) line so the full
    // white→yellow→orange→red progression plays out left of it
    $("rpm-bar").style.width=rpmPct+"%";
    const sr=sa.ready?sa.shift_rpm:0;
    const srPct=sr>0?Math.max(0,Math.min(100,(sr-rpmIdle)/range*100)):0;
    const[c0,c1]=rpmColor(rpmPct,ys,srPct>0?srPct:100);
    const bri=s.rpm_bar_brightness??1,hue=s.rpm_bar_hue??0;
    $("rpm-bar").style.background=`linear-gradient(to right,${tint(c0,bri,hue)},${tint(c1,bri,hue)})`;

    // Shift/limiter lines with display-layer EMA anti-flicker
    if(!window._ms){window._ms={sr:0,lr:100,pl:33,pw:30};}
    const ma=s.marker_ema_alpha||0.06;
    window._ms.sr+=(srPct-window._ms.sr)*ma;
    $("shift-line").style.left=window._ms.sr+"%";

    const lr=sa.fuel_cut_rpm||sa.limiter_rpm||rpmMax;
    const lrPct=Math.min((lr-rpmIdle)/range*100,100);
    window._ms.lr+=lrPct>0?(lrPct-window._ms.lr)*ma:0;
    $("limiter-line").style.left=window._ms.lr+"%";

    // Power band with display-layer EMA
    if(d.shift_advice&&d.shift_advice.ready&&d.shift_advice.shift_rpm>rpmIdle){
      const pb=d.power_band;
      const rawLeft=Math.max(0,(pb.lo-rpmIdle)/range*100);
      const rawW=Math.max(0,(pb.hi-pb.lo)/range*100);
      const plPct=Math.min(rawLeft,100);
      const pwPct=Math.min(rawW,100-plPct);
      window._ms.pl=Math.max(0,Math.min(100,window._ms.pl+(plPct>0?(plPct-window._ms.pl)*ma:0)));
      window._ms.pw=Math.max(0,Math.min(100,window._ms.pw+(pwPct>0?(pwPct-window._ms.pw)*ma:0)));
      $("pwr-band").style.left=window._ms.pl+"%";
      $("pwr-band").style.width=window._ms.pw+"%";
      $("pwr-band").style.display="";
    }else{
      // Demo: 33-63%
      window._ms.pl=Math.max(0,Math.min(100,window._ms.pl+(33-window._ms.pl)*ma));
      window._ms.pw=Math.max(0,Math.min(100,window._ms.pw+(30-window._ms.pw)*ma));
      $("pwr-band").style.left=window._ms.pl+"%";
      $("pwr-band").style.width=window._ms.pw+"%";
      $("pwr-band").style.display="";
    }

    // Strobe: red flash (RPM within red_flash_pct of the limiter line's left
    // edge) outranks the blue shift strobe. Both flash on top of the live
    // gradient — the bar's static colors stay visible outside flash windows.
    const ur=sa.urgency;
    const redFlash=!d.is_ev&&rpmPct>=window._ms.lr-(s.red_flash_pct??0.01)*100;
    if(redFlash){
      $("gear").classList.add("strobe-red");$("gear").classList.remove("strobe");$("gear").style.color="";
      $("rpm-bar").classList.add("bar-strobe-red");$("rpm-bar").classList.remove("bar-strobe");
    }else if(ur==="shift"||ur==="over"){
      $("gear").classList.add("strobe");$("gear").classList.remove("strobe-red");$("gear").style.color="";
      $("rpm-bar").classList.add("bar-strobe");$("rpm-bar").classList.remove("bar-strobe-red");
    }else{
      $("gear").classList.remove("strobe");$("gear").classList.remove("strobe-red");
      $("gear").style.color=ur==="near"?"#d2991d":"#fff";
      $("rpm-bar").classList.remove("bar-strobe");$("rpm-bar").classList.remove("bar-strobe-red");
    }

    // SLIP
    const ms=d.max_slip||0;
    $("slip").style.color=ms>(s.slip_danger??2.0)?"#ff3333":ms>(s.slip_warn??0.5)?"#ffcc00":"";

    // EV
    if(d.is_ev){
      $("shift-line").style.display="none";$("limiter-line").style.display="none";
      $("pwr-band").style.display="none";$("rpm-bar").style.background="linear-gradient(to right,#3399ff44,#3399ff)";
      $("gear").classList.remove("strobe");$("gear").classList.remove("strobe-red");
      $("rpm-bar").classList.remove("bar-strobe");$("rpm-bar").classList.remove("bar-strobe-red");
    }else{
      $("shift-line").style.display="";$("limiter-line").style.display="";
    }

    // Slip bar: max |slip ratio| across all four wheels (driven wheels spin on
    // throttle, any wheel can lock under braking — the worst wheel is the one
    // that matters). Always on while moving; thresholds relax at crawl speed
    // (launch dig isn't actionable + the ratio inflates at low speed anyway).
    const sbShow=(s.slip_bar??true);
    $("slip-wrap").style.opacity=sbShow?"1":"0";
    if(sbShow){
      $("slip-wrap").style.width=(s.rpm_bar_width||260)+"px";
      const ts=d.tire_slip||[0,0,0,0];
      let ls=0;
      for(let k=0;k<4;k++){const v=Math.abs(ts[k]||0);if(v>ls)ls=v;}
      window._ls=(window._ls??0)+((ls-(window._ls??0))*0.12);
      const L=window._ls,kmh=d.speed_kmh||0;
      const leni=Math.max(0,Math.min(1,(25-kmh)/20));
      const yW=s.slip_warn??0.5,rD=s.slip_danger??2.0;
      const yT=yW*(1+leni),rT=rD+1.5*leni;
      $("slip-bar").style.width=Math.min(Math.log1p(L)/Math.log1p(100)*100,100)+"%";
      $("slip-bar").style.background=L<yT?"rgba(255,255,255,0.6)":L<rT?"rgba(212,168,67,0.8)":"rgba(255,51,51,0.9)";
    }
  };
  ws.onclose=()=>setTimeout(connect,3000);
}
connect();
</script>
</body>
</html>
