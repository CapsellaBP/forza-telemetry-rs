[package]
name = "forza-telemetry-rs"
version = "0.2.0"
description = "Forza Telemetry RS - UDP capture, HUD overlay, shift advisor"
authors = ["capsellabp"]
edition = "2021"

[lib]
name = "forza_telemetry_rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
bytes = "1"
socket2 = "0.5"
chrono = "0.4"

